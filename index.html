<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cainiguai · 个人主页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #17211b;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #e9f3ed, #f7eee3);
    }
    main {
      width: min(720px, 100%);
      padding: clamp(36px, 8vw, 72px);
      border: 1px solid #17211b20;
      border-radius: 28px;
      background: #ffffffcc;
      box-shadow: 0 24px 70px #1f2b2420;
    }
    small { color: #1e6b4f; font-weight: 700; letter-spacing: .15em; }
    h1 { margin: 18px 0; font-size: clamp(48px, 10vw, 80px); line-height: 1; }
    p { color: #5f6d64; font-size: 20px; line-height: 1.7; }
    a { color: #1e6b4f; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <small>HELLO, WORLD</small>
    <h1>我是<br>cainiguai.</h1>
    <p>欢迎来到我的个人主页。我正在这里记录学习、创作与成长。</p>
    <a href="https://github.com/cainiguai">访问我的 GitHub →</a>
  </main>
</body>
</html>
